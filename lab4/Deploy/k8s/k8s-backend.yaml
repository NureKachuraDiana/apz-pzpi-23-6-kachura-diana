apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
data:
  PORT: "5193"
  WOKWI_PORT: "5195"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "EcoMonitor"
  DB_USER: "postgres"
  NODE_ENV: "prod"
  FRONTEND_URL: "http://localhost:3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: backend
type: Opaque
data:
  DB_PASSWORD: MXEydzNlNHI1dA==
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOjFxMnczZTRyNXRAcG9zdGdyZXMtc2VydmljZTo1NDMyL0Vjb01vbml0b3I/c2NoZW1hPXB1YmxpYw==
  JWT_SECRET: NjU3OEBsb2NhbGhvc3Q6NTQzMy9FY29Nb25pdG9yP3NjaGVtYT1wdWJsaWM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dianakachura/eco-monitor-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5193
              name: main-port
            - containerPort: 5195
              name: wokwi-port
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /monitoring-station
              port: 5193
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /monitoring-station
              port: 5193
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: LoadBalancer
  ports:
    - name: main-http
      port: 5193
      targetPort: 5193
      protocol: TCP
    - name: wokwi-http
      port: 5195
      targetPort: 5195
      protocol: TCP
  selector:
    app: backend
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  labels:
    app: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
